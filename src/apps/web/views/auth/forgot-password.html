<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Recuperar senha</title>
    <style>
      body {
        font-family: system-ui, Arial;
        background: #f6f7fb;
        margin: 0;
      }
      .card {
        max-width: 420px;
        margin: 8vh auto;
        background: #fff;
        padding: 24px;
        border-radius: 14px;
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.08);
      }
      label {
        display: block;
        margin: 10px 0 6px;
      }
      input {
        width: 100%;
        padding: 12px;
        border: 1px solid #ddd;
        border-radius: 10px;
      }
      button {
        width: 100%;
        padding: 12px;
        margin-top: 14px;
        border: 0;
        border-radius: 10px;
        background: #5562ff;
        color: #fff;
        font-weight: 600;
      }
      .msg {
        margin: 8px 0;
        padding: 10px;
        border-radius: 8px;
      }
      .err {
        background: #ffe9e9;
        color: #9b1c1c;
        border: 1px solid #f9caca;
      }
      .ok {
        background: #e6fff0;
        color: #137a3a;
        border: 1px solid #bfead0;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h2>Recuperar senha</h2>
      <p>
        Informe seu e-mail. Se encontrarmos uma conta, enviaremos instruções.
      </p>
      {{if .Error}}
      <div class="msg err">{{.Error}}</div>
      {{end}} {{if .Success}}
      <div class="msg ok">{{.Success}}</div>
      {{end}}
      <form method="POST" action="/auth/forgot-password">
        <label for="email">Email</label>
        <input id="email" type="email" name="email" required />
        <button type="submit">Enviar instruções</button>
      </form>
    </div>
  </body>
</html>
