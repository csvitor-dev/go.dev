<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Redefinir Senha</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f9f9f9;
      }
      .container {
        max-width: 400px;
        margin: 50px auto;
        background: #fff;
        padding: 20px;
        border-radius: 8px;
      }
      h2 {
        text-align: center;
      }
      .error {
        color: red;
        margin-bottom: 10px;
        text-align: center;
      }
      input {
        width: 100%;
        padding: 10px;
        margin: 8px 0;
        border: 1px solid #ccc;
        border-radius: 4px;
      }
      button {
        width: 100%;
        padding: 10px;
        background: #4caf50;
        color: #fff;
        border: none;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>Redefinir Senha</h2>
      {{if .Error}}
      <div class="error">{{.Error}}</div>
      {{end}}
      <form method="POST" action="/auth/reset-password">
        <input type="hidden" name="token" value="{{.Token}}" />
        <input
          type="password"
          name="password"
          placeholder="Nova senha"
          {{if
          .Error}}
          disabled
          {{end}}
        />
        <input
          type="password"
          name="confirm"
          placeholder="Confirme a senha"
          {{if
          .Error}}
          disabled
          {{end}}
        />
        <button type="submit" {{if .Error}} disabled {{end}}>Redefinir</button>
      </form>
    </div>
  </body>
</html>
